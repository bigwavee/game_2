<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>스카이 스트라이커</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Malgun Gothic", system-ui, sans-serif; }
  canvas { background: #0a1024; max-width: 100vw; max-height: 100vh; aspect-ratio: 9 / 16; height: 100vh; box-shadow: 0 0 40px #0008; }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;left:12px;bottom:12px;color:#adb5bd;font-size:13px;text-decoration:none;background:#0008;padding:6px 10px;border-radius:8px">← 메뉴</a>
<canvas id="c" width="480" height="854"></canvas>
<script>
// ===== 기본 설정 =====
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') startGame();
  if (e.code === 'KeyB' && state === 'play') useBomb();
  if (e.code === 'Escape') location.href = 'index.html'; // 메인 메뉴로
});
addEventListener('keyup', e => { keys[e.code] = false; });

// 마우스·터치: 드래그한 만큼 기체 이동
let pointer = null;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.tabIndex = 0;
cv.style.outline = 'none';
cv.addEventListener('pointerdown', e => {
  cv.focus(); // 클릭 후 키보드 입력이 게임으로 전달되도록
  if (state !== 'play') { startGame(); return; }
  pointer = { ...toCanvas(e), px: player.x, py: player.y };
});
cv.addEventListener('pointermove', e => {
  if (!pointer || state !== 'play') return;
  const p = toCanvas(e);
  player.x = clamp(pointer.px + (p.x - pointer.x) * 1.3, 20, W - 20);
  player.y = clamp(pointer.py + (p.y - pointer.y) * 1.3, 40, H - 30);
});
addEventListener('pointerup', () => pointer = null);
cv.addEventListener('dblclick', () => state === 'play' && useBomb());

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const hit = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;

function loadBest() { try { return +localStorage.getItem('skyStrikerBest') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('skyStrikerBest', v); } catch {} }

// ===== 효과음 (WebAudio, 외부 파일 없음) =====
let actx = null;
function sfx(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

// ===== 배경 별 =====
const stars = Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(0.5, 2.2) }));
const clouds = Array.from({ length: 5 }, () => ({ x: rand(0, W), y: rand(0, H), w: rand(80, 180) }));

// ===== 게임 상태 =====
let state = 'title', paused = false;
let player, bullets, enemies, eBullets, items, parts = [], score, best = loadBest(), frame = 0, level, boss, bossDue, shake, flash;

function startGame() {
  player = { x: W / 2, y: H - 120, r: 12, hp: 5, maxHp: 5, power: 1, cool: 0, inv: 90, shield: 0, bombs: 2 };
  bullets = []; enemies = []; eBullets = []; items = []; parts = [];
  score = 0; frame = 0; level = 1; boss = null; bossDue = 3000; shake = 0; flash = 0;
  state = 'play'; paused = false;
  sfx(440, 0.15, 'triangle', 0.08, 440);
}

function useBomb() {
  if (player.bombs <= 0) return;
  player.bombs--; flash = 20; shake = 15;
  sfx(120, 0.8, 'sawtooth', 0.12, -90);
  eBullets = [];
  for (const e of enemies) damageEnemy(e, 20);
  if (boss) damageEnemy(boss, 40);
}

// ===== 적 생성 =====
const ENEMY = {
  small:  { r: 14, hp: 1,  sp: 2.6, pts: 100, color: '#ff6b6b' },
  zig:    { r: 16, hp: 3,  sp: 1.8, pts: 200, color: '#ffa94d' },
  tank:   { r: 24, hp: 10, sp: 1.0, pts: 500, color: '#b197fc' },
};
function spawnEnemy() {
  const pool = level < 2 ? ['small','small','zig'] : level < 4 ? ['small','zig','zig','tank'] : ['small','zig','tank','tank'];
  const kind = pool[Math.floor(Math.random() * pool.length)];
  const d = ENEMY[kind];
  enemies.push({ kind, x: rand(30, W - 30), y: -30, r: d.r, hp: d.hp + Math.floor(level / 3), maxHp: d.hp,
    sp: d.sp + level * 0.15, t: rand(0, 6), fire: rand(60, 140), pts: d.pts, color: d.color, hitT: 0 });
}
function spawnBoss() {
  const hp = 180 + level * 60;
  boss = { kind: 'boss', x: W / 2, y: -80, r: 48, hp, maxHp: hp, t: 0, fire: 0, pts: 5000, color: '#e64980', hitT: 0, phase: 0 };
  sfx(80, 1.2, 'sawtooth', 0.1, 60);
}

// ===== 탄 =====
function aimShot(src, speed, spread = 0, n = 1) {
  const base = Math.atan2(player.y - src.y, player.x - src.x);
  for (let i = 0; i < n; i++) {
    const a = base + (n > 1 ? (i - (n - 1) / 2) * spread : 0);
    eBullets.push({ x: src.x, y: src.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
  }
}
function ringShot(src, n, speed, off = 0) {
  for (let i = 0; i < n; i++) {
    const a = off + i * Math.PI * 2 / n;
    eBullets.push({ x: src.x, y: src.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
  }
}
function playerShoot() {
  const p = player.power;
  const add = (dx, vx) => bullets.push({ x: player.x + dx, y: player.y - 18, vx, vy: -11, r: 4 });
  add(0, 0);
  if (p >= 2) { add(-10, 0); add(10, 0); }
  if (p >= 3) { add(-14, -1.6); add(14, 1.6); }
  if (p >= 4) { add(-18, -3); add(18, 3); }
  player.cool = p >= 5 ? 5 : 7;
  sfx(880, 0.05, 'square', 0.015, -300);
}

// ===== 파티클 =====
function explode(x, y, color, n = 18, big = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, 5) * big;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, color, size: rand(2, 4) * big });
  }
}

function damageEnemy(e, dmg) {
  e.hp -= dmg; e.hitT = 4;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    score += e.pts;
    explode(e.x, e.y, e.color, e.kind === 'boss' ? 80 : 20, e.kind === 'boss' ? 2.2 : 1);
    sfx(e.kind === 'boss' ? 60 : 160, e.kind === 'boss' ? 1 : 0.25, 'sawtooth', 0.08, -100);
    shake = e.kind === 'boss' ? 25 : 4;
    // 아이템 드롭
    const roll = Math.random();
    if (e.kind === 'boss') {
      items.push({ x: e.x - 30, y: e.y, type: 'P', r: 12 }, { x: e.x, y: e.y, type: 'H', r: 12 }, { x: e.x + 30, y: e.y, type: 'B', r: 12 });
    } else if (roll < (e.kind === 'tank' ? 0.6 : 0.12)) {
      const t = Math.random();
      items.push({ x: e.x, y: e.y, type: t < 0.5 ? 'P' : t < 0.75 ? 'H' : t < 0.9 ? 'S' : 'B', r: 12 });
    }
  }
}

function hurtPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 40; sfx(300, 0.2, 'triangle', 0.08); return; }
  player.hp--; player.inv = 90; shake = 12;
  player.power = Math.max(1, player.power - 1);
  explode(player.x, player.y, '#74c0fc', 25);
  sfx(100, 0.4, 'sawtooth', 0.1, -50);
  if (player.hp <= 0) {
    explode(player.x, player.y, '#ffffff', 60, 2);
    state = 'over';
    if (score > best) { best = score; saveBest(best); }
  }
}

// ===== 업데이트 =====
function update() {
  // 배경은 항상 흐름
  for (const s of stars) { s.y += s.s * 1.5; if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  for (const c of clouds) { c.y += 0.6; if (c.y > H + 60) { c.y = -60; c.x = rand(0, W); } }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  parts = parts.filter(p => p.life > 0);
  if (state !== 'play' || paused) return;

  frame++;
  level = 1 + Math.floor(score / 4000);
  if (shake > 0) shake--;
  if (flash > 0) flash--;

  // 플레이어 이동
  const sp = keys.ShiftLeft || keys.ShiftRight ? 3 : 6;
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x = clamp(player.x + dx * sp, 20, W - 20);
  player.y = clamp(player.y + dy * sp, 40, H - 30);
  player.tilt = dx;
  if (player.inv > 0) player.inv--;
  if (player.shield > 0) player.shield--;

  // 자동 사격
  if (--player.cool <= 0) playerShoot();

  // 적 스폰
  if (!boss) {
    const rate = Math.max(18, 55 - level * 5);
    if (frame % rate === 0) spawnEnemy();
    if (score >= bossDue) { spawnBoss(); bossDue += 6000; }
  }

  // 아군 탄
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  // 적
  for (const e of enemies) {
    e.t += 0.05;
    if (e.hitT) e.hitT--;
    if (e.kind === 'zig') { e.x += Math.sin(e.t * 2) * 2.5; e.y += e.sp; }
    else if (e.kind === 'tank') { e.y += e.y < 160 ? e.sp * 1.5 : e.sp * 0.4; }
    else e.y += e.sp;
    e.x = clamp(e.x, 15, W - 15);
    if (--e.fire <= 0 && e.y > 0 && e.y < H * 0.7) {
      if (e.kind === 'tank') ringShot(e, 8 + level, 2.5, e.t);
      else aimShot(e, 3 + level * 0.2);
      e.fire = rand(90, 160) - level * 6;
    }
    if (hit(e, player)) { hurtPlayer(); damageEnemy(e, 5); }
  }

  // 보스 패턴
  if (boss) {
    const b = boss;
    b.t++;
    if (b.hitT) b.hitT--;
    if (b.y < 130) b.y += 1.5;
    else {
      b.x = W / 2 + Math.sin(b.t * 0.015) * (W / 2 - 70);
      b.phase = b.hp < b.maxHp * 0.5 ? 1 : 0;
      if (b.t % (b.phase ? 50 : 70) === 0) ringShot(b, 16 + level * 2, 2.8, b.t * 0.05);
      if (b.t % 40 === 20) aimShot(b, 4.5, 0.18, b.phase ? 5 : 3);
      if (b.phase && b.t % 8 === 0) {
        const a = b.t * 0.12;
        eBullets.push({ x: b.x, y: b.y + 20, vx: Math.cos(a) * 3, vy: Math.abs(Math.sin(a)) * 3 + 1, r: 4 });
      }
    }
    if (hit(b, player)) hurtPlayer();
    if (b.dead) { boss = null; player.bombs = Math.min(5, player.bombs + 1); }
  }

  // 충돌: 아군탄 → 적
  const targets = boss ? [...enemies, boss] : enemies;
  for (const bl of bullets) {
    for (const e of targets) {
      if (!e.dead && hit(bl, e)) { bl.dead = true; damageEnemy(e, 1); parts.push({ x: bl.x, y: bl.y, vx: rand(-1,1), vy: rand(-1,1), life: 8, max: 8, color: '#fff', size: 2 }); break; }
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 40);

  // 적탄
  for (const b of eBullets) {
    b.x += b.vx; b.y += b.vy;
    if (state === 'play' && Math.hypot(b.x - player.x, b.y - player.y) < b.r + 5) { b.dead = true; hurtPlayer(); }
  }
  eBullets = eBullets.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // 아이템
  for (const it of items) {
    it.y += 1.6;
    // 가까우면 끌려옴
    const d = Math.hypot(player.x - it.x, player.y - it.y);
    if (d < 90) { it.x += (player.x - it.x) * 0.08; it.y += (player.y - it.y) * 0.08; }
    if (d < it.r + player.r + 4) {
      it.dead = true;
      if (it.type === 'P') { if (player.power < 5) player.power++; else score += 1000; }
      if (it.type === 'H') player.hp = Math.min(player.maxHp, player.hp + 1);
      if (it.type === 'S') player.shield = 600;
      if (it.type === 'B') player.bombs = Math.min(5, player.bombs + 1);
      sfx(660, 0.15, 'triangle', 0.07, 600);
    }
  }
  items = items.filter(i => !i.dead && i.y < H + 20);
}

// ===== 그리기 =====
function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 4) % 2) return;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.scale(1 - Math.abs(p.tilt || 0) * 0.15, 1);
  // 엔진 불꽃
  ctx.fillStyle = `rgba(255,${150 + Math.random() * 80},60,0.9)`;
  ctx.beginPath(); ctx.moveTo(-5, 16); ctx.lineTo(0, 24 + Math.random() * 10); ctx.lineTo(5, 16); ctx.fill();
  // 날개
  ctx.fillStyle = '#4dabf7';
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(24, 10); ctx.lineTo(22, 15); ctx.lineTo(0, 9); ctx.lineTo(-22, 15); ctx.lineTo(-24, 10); ctx.closePath(); ctx.fill();
  // 꼬리날개
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(10, 18); ctx.lineTo(-10, 18); ctx.closePath(); ctx.fill();
  // 동체
  ctx.fillStyle = '#e7f5ff';
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.quadraticCurveTo(7, -6, 5, 16); ctx.lineTo(-5, 16); ctx.quadraticCurveTo(-7, -6, 0, -22); ctx.fill();
  // 조종석
  ctx.fillStyle = '#1c7ed6';
  ctx.beginPath(); ctx.ellipse(0, -8, 2.8, 6, 0, 0, Math.PI * 2); ctx.fill();
  if (p.shield > 0) {
    ctx.strokeStyle = `rgba(116,192,252,${p.shield < 120 && Math.floor(p.shield / 6) % 2 ? 0.2 : 0.7})`;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = e.hitT ? '#fff' : e.color;
  const r = e.r;
  if (e.kind === 'small') {
    ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(r, -r * 0.6); ctx.lineTo(0, -r * 0.2); ctx.lineTo(-r, -r * 0.6); ctx.closePath(); ctx.fill();
  } else if (e.kind === 'zig') {
    ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(r * 1.2, 0); ctx.lineTo(r * 0.5, -r); ctx.lineTo(-r * 0.5, -r); ctx.lineTo(-r * 1.2, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0008'; ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
  } else if (e.kind === 'tank') {
    ctx.rotate(e.t);
    for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); ctx.fillRect(-4, -r - 4, 8, 10); }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0006'; ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (e.kind === 'boss') {
    ctx.beginPath();
    ctx.moveTo(0, r); ctx.lineTo(r * 1.6, -r * 0.2); ctx.lineTo(r * 1.3, -r * 0.7); ctx.lineTo(r * 0.4, -r * 0.4);
    ctx.lineTo(0, -r); ctx.lineTo(-r * 0.4, -r * 0.4); ctx.lineTo(-r * 1.3, -r * 0.7); ctx.lineTo(-r * 1.6, -r * 0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = e.phase ? '#ffd43b' : '#ffe3e3';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.3 + Math.sin(e.t * 0.2) * 3, 0, Math.PI * 2); ctx.fill();
  }
  if (e.kind === 'tank' && e.hp < e.maxHp) {
    ctx.rotate(-e.t);
    ctx.fillStyle = '#0008'; ctx.fillRect(-r, r + 6, r * 2, 3);
    ctx.fillStyle = '#69db7c'; ctx.fillRect(-r, r + 6, r * 2 * Math.max(0, e.hp / (e.maxHp + Math.floor(level / 3))), 3);
  }
  ctx.restore();
}

const ITEM_STYLE = { P: ['#fab005', 'P'], H: ['#51cf66', '+'], S: ['#74c0fc', 'S'], B: ['#ff6b6b', 'B'] };
function drawItem(it) {
  const [c, t] = ITEM_STYLE[it.type];
  const pulse = 1 + Math.sin(frame * 0.15) * 0.1;
  ctx.save(); ctx.translate(it.x, it.y); ctx.scale(pulse, pulse);
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, 0, 1);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`점수 ${score.toLocaleString()}`, 14, 12);
  ctx.font = '13px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#adb5bd';
  ctx.fillText(`최고 ${best.toLocaleString()}  ·  레벨 ${level}  ·  무기 ${player.power}`, 14, 38);
  // 체력
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? '#ff6b6b' : '#343a40';
    ctx.fillRect(W - 24 - i * 18, 16, 14, 14);
  }
  // 폭탄
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffa8a8'; ctx.font = '13px "Malgun Gothic", sans-serif';
  ctx.fillText(`폭탄 ${'●'.repeat(player.bombs)}`, W - 12, 38);
  // 보스 체력바
  if (boss && boss.y > 0) {
    ctx.fillStyle = '#0009'; ctx.fillRect(40, 62, W - 80, 10);
    ctx.fillStyle = boss.phase ? '#ffd43b' : '#e64980'; ctx.fillRect(40, 62, (W - 80) * Math.max(0, boss.hp / boss.maxHp), 10);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('BOSS', W / 2, 76);
  }
}

function centerText(lines) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [txt, y, size, color] of lines) {
    ctx.font = `bold ${size}px "Malgun Gothic", sans-serif`; ctx.fillStyle = color; ctx.fillText(txt, W / 2, y);
  }
}

function draw() {
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  // 배경
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#1b2a5a');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const c of clouds) { ctx.fillStyle = '#ffffff08'; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w, c.w * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${0.3 + s.s * 0.3})`; ctx.fillRect(s.x, s.y, s.s, s.s * 2); }

  if (state === 'play' || state === 'over') {
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    if (boss) drawEnemy(boss);
    ctx.fillStyle = '#ffec99';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    for (const b of eBullets) {
      ctx.fillStyle = '#ff8787'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    if (state === 'play') drawPlayer();
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash) { ctx.fillStyle = `rgba(255,255,255,${flash / 25})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'play') {
    drawHUD();
    if (paused) { ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, W, H); centerText([['일시정지', H / 2, 36, '#fff'], ['P 키로 계속', H / 2 + 44, 16, '#adb5bd']]); }
  } else if (state === 'title') {
    centerText([
      ['SKY STRIKER', H * 0.3, 46, '#74c0fc'],
      ['스카이 스트라이커', H * 0.3 + 48, 20, '#e7f5ff'],
      ['이동: 방향키 / WASD / 드래그', H * 0.55, 16, '#dee2e6'],
      ['사격: 자동   ·   느리게: Shift', H * 0.55 + 28, 16, '#dee2e6'],
      ['폭탄: B / 더블클릭   ·   일시정지: P', H * 0.55 + 56, 16, '#dee2e6'],
      ['아이템  P 무기강화 · + 체력 · S 보호막 · B 폭탄', H * 0.55 + 96, 13, '#adb5bd'],
      [frame % 60 < 40 ? 'Enter 또는 클릭으로 시작' : '', H * 0.82, 20, '#ffd43b'],
      [`최고 점수 ${best.toLocaleString()}`, H * 0.9, 14, '#868e96'],
      ['Esc: 메뉴로', H * 0.94, 13, '#868e96'],
    ]);
    frame++;
  } else if (state === 'over') {
    ctx.fillStyle = '#0009'; ctx.fillRect(0, 0, W, H);
    centerText([
      ['GAME OVER', H * 0.38, 46, '#ff6b6b'],
      [`점수 ${score.toLocaleString()}`, H * 0.48, 26, '#fff'],
      [score >= best && score > 0 ? '신기록!' : `최고 점수 ${best.toLocaleString()}`, H * 0.48 + 38, 18, '#ffd43b'],
      ['Enter 또는 클릭으로 다시 시작', H * 0.65, 18, '#dee2e6'],
      ['Esc: 메뉴로', H * 0.65 + 32, 14, '#868e96'],
    ]);
  }
}

// 고정 시간 간격(60회/초)으로 진행 → 모니터 주사율과 무관하게 속도 일정
const STEP = 1000 / 60;
let acc = 0, last = performance.now();
function tick() {
  const now = performance.now();
  acc += Math.min(250, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n) draw();
}
function loop() { tick(); requestAnimationFrame(loop); }
// requestAnimationFrame이 멈추는 환경(미리보기 창 등) 대비 타이머 보조 구동
setInterval(tick, STEP);
draw();
loop();
</script>
</body>
</html>
