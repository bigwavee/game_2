<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 아케이드</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1b2a5a 0%, #0b1230 55%, #05070f 100%) fixed;
    color: #e7f5ff; font-family: "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 48px 16px;
  }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 52px); letter-spacing: 4px; color: #74c0fc; text-shadow: 0 0 18px #4dabf788; }
  .sub { margin: 8px 0 40px; color: #adb5bd; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 340px)); gap: 24px; width: 100%; justify-content: center; }
  @media (max-width: 720px) { .cards { grid-template-columns: minmax(0, 420px); } }
  a.card {
    display: block; text-decoration: none; color: inherit; border-radius: 16px; padding: 24px;
    background: #ffffff0c; border: 1px solid #ffffff1f; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-4px); outline: none; }
  a.shoot:hover, a.shoot:focus-visible { border-color: #74c0fc; box-shadow: 0 0 24px #4dabf755; }
  a.brick:hover, a.brick:focus-visible { border-color: #f783ac; box-shadow: 0 0 24px #f783ac55; }
  .art { height: 150px; border-radius: 10px; margin-bottom: 18px; display: block; width: 100%; }
  .num { font-size: 12px; color: #868e96; }
  h2 { margin: 4px 0 6px; font-size: 24px; }
  .shoot h2 { color: #74c0fc; }
  .brick h2 { color: #f783ac; }
  p { margin: 0 0 14px; color: #ced4da; line-height: 1.5; font-size: 14px; }
  .keys { font-size: 13px; color: #adb5bd; line-height: 1.7; }
  .best { margin-top: 14px; font-size: 14px; color: #ffd43b; }
  footer { margin-top: 40px; color: #868e96; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <h1>MINI ARCADE</h1>
  <div class="sub">플레이할 게임을 고르세요</div>

  <div class="cards">
    <a class="card shoot" href="shooter.html">
      <svg class="art" viewBox="0 0 300 150" aria-hidden="true">
        <rect width="300" height="150" fill="#0b1230"/>
        <g fill="#fff" opacity=".6"><circle cx="30" cy="20" r="1"/><circle cx="250" cy="40" r="1.2"/><circle cx="120" cy="90" r="1"/><circle cx="200" cy="120" r=".8"/><circle cx="60" cy="110" r="1.2"/></g>
        <path d="M150 28 l22 16 -6 6 -16 -6 -16 6 -6 -6z" fill="#ff6b6b"/>
        <path d="M100 50 l12 9 -4 3 -8 -3 -8 3 -4 -3z M200 52 l12 9 -4 3 -8 -3 -8 3 -4 -3z" fill="#ffa94d"/>
        <g fill="#ffec99"><rect x="148" y="70" width="4" height="10"/><rect x="148" y="90" width="4" height="10"/></g>
        <path d="M150 104 q5 12 4 30 h-8 q-1 -18 4 -30z" fill="#e7f5ff"/>
        <path d="M150 116 l20 12 -2 4 -18 -5 -18 5 -2 -4z" fill="#4dabf7"/>
      </svg>
      <div class="num">1번</div>
      <h2>스카이 스트라이커</h2>
      <p>세로 스크롤 비행기 슈팅. 쏟아지는 적과 보스의 탄막을 피하며 무기를 강화하세요.</p>
      <div class="keys">이동 방향키·WASD·드래그 · 사격 자동 · 폭탄 B</div>
      <div class="best" id="best1">최고 점수 0</div>
    </a>

    <a class="card brick" href="breakout.html">
      <svg class="art" viewBox="0 0 300 150" aria-hidden="true">
        <rect width="300" height="150" fill="#120b24"/>
        <g>
          <rect x="22" y="20" width="44" height="14" rx="3" fill="#f783ac"/><rect x="72" y="20" width="44" height="14" rx="3" fill="#f783ac"/>
          <rect x="122" y="20" width="44" height="14" rx="3" fill="#da77f2"/><rect x="172" y="20" width="44" height="14" rx="3" fill="#da77f2"/>
          <rect x="222" y="20" width="44" height="14" rx="3" fill="#9775fa"/>
          <rect x="47" y="40" width="44" height="14" rx="3" fill="#66d9e8"/><rect x="97" y="40" width="44" height="14" rx="3" fill="#868e96"/>
          <rect x="147" y="40" width="44" height="14" rx="3" fill="#66d9e8"/><rect x="197" y="40" width="44" height="14" rx="3" fill="#8ce99a"/>
        </g>
        <path d="M120 128 L175 82" stroke="#ffffff33" stroke-dasharray="4 5" stroke-width="2"/>
        <circle cx="178" cy="80" r="6" fill="#fff"/>
        <rect x="95" y="130" width="70" height="9" rx="4.5" fill="#66d9e8"/>
      </svg>
      <div class="num">2번</div>
      <h2>네온 브릭</h2>
      <p>네온 벽돌깨기. 패들에 맞는 위치로 공의 각도를 조절해 5개 스테이지를 돌파하세요.</p>
      <div class="keys">이동 마우스·←→·A/D · 발사 Space·클릭</div>
      <div class="best" id="best2">최고 점수 0</div>
    </a>
  </div>

  <footer>키보드 1 / 2 로도 선택할 수 있습니다 · 게임 중 Esc 를 누르면 이 화면으로 돌아옵니다</footer>

<script>
  // 각 게임이 저장한 최고 점수 표시 (저장소를 쓸 수 없는 환경이면 0)
  function readBest(key) { try { return +localStorage.getItem(key) || 0; } catch { return 0; } }
  document.getElementById('best1').textContent = `최고 점수 ${readBest('skyStrikerBest').toLocaleString()}`;
  document.getElementById('best2').textContent = `최고 점수 ${readBest('brickBreakerBest').toLocaleString()}`;
  addEventListener('keydown', e => {
    if (e.key === '1') location.href = 'shooter.html';
    if (e.key === '2') location.href = 'breakout.html';
  });
</script>
</body>
</html>
